# .github/workflows/ci.yml
# GitHub Actions CI/CD Pipeline for Rust

name: Rust CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # 1. Build and Test Job
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview

      - name: Compile project
        run: cargo build --verbose

      - name: Run test suite
        run: cargo test --verbose

      - name: Run code linter
        run: cargo clippy -- -D warnings

  # 2. Separate Coverage Job to isolate coverage instrumentation
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
  
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
  
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.8
        with:
          tool: cargo-llvm-cov@0.9.1
  
      - name: Generate coverage report
        run: cargo llvm-cov --html --output-dir target/coverage/html
  
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/coverage/html/
          retention-days: 7
  
