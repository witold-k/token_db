[package]
name = "token_db"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
# -- serializer --------------------------------------------------------------
serde = { version = "1.0", features = ["derive", "rc"] }
postcard = { version = "1.1.3", features = ["alloc"] }

# -- storage crates ----------------------------------------------------------
rustc-hash = "2.1"

struct_extractors = { version = "0.1.0", git = "https://github.com/witold-k/struct_extractors" }

[dev-dependencies]
tempfile = "3"

