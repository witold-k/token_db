[package]
name = "token_db"
version = "0.1.0"
edition = "2024"
description = "A small token database with stable IDs, frequency counts, merging, and binary persistence."
license = "Apache-2.0"
repository = "https://github.com/witold-k/token_db"
readme = "README.md"
keywords = ["token", "database", "frequency", "nlp"]
categories = ["data-structures", "encoding"]

[dependencies]
# -- serializer + fileio -----------------------------------------------------
serde = { version = "1.0", features = ["derive", "rc"] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
tempfile = "3"

# -- storage crates ----------------------------------------------------------
rustc-hash = "2.1"

struct_extractors = { version = "0.1.0", git = "https://github.com/witold-k/struct_extractors" }


